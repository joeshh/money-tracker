<style>

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s}

@media(min-width:640px){.ov{align-items:center;padding:16px}}

.chip{display:inline-block;font-size:12px;border:1px solid var(--ln);border-radius:20px;padding:2px 10px;margin:3px 4px 3px 0}.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.no{color:var(--pen);border-color:var(--pen)}
.bl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.bl:first-of-type{border-top:0}
details.dd{border:0;box-shadow:none;margin:6px 0 0;background:none;border-radius:0}details.dd summary{padding:6px 0;font-size:13px;color:var(--mu);cursor:pointer;display:block}

.cal{margin:8px 0 2px}.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw span{text-align:center;font-size:11px;color:var(--mu);padding-bottom:2px}

details.mo{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden}details.mo>summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;list-style:none;flex-wrap:wrap}details.mo>summary::-webkit-details-marker{display:none}details.mo>summary b{color:var(--ac);font-size:15px}details.mo .in{padding:0 14px 10px}
.cc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.cc button{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:16px;padding:6px 12px;font-size:14px}.cc button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.cc button.nw{background:transparent;color:var(--mu)}
.ch{display:block;max-width:none;font-family:inherit}.ch .cb2{fill:var(--ac);opacity:.78}.ch .cb2.sel{opacity:1;stroke:var(--tx);stroke-width:1.5}.ch .v{fill:var(--tx);font-size:11px;font-weight:600;text-anchor:middle}.ch .m{fill:var(--mu);font-size:11px;text-anchor:middle}.ch .ln{stroke:var(--pen);stroke-width:2;fill:none}.ch .dot{fill:var(--pen)}.ch .av{stroke:var(--mu);stroke-dasharray:4 4;stroke-width:1}.ch .bs{stroke:var(--ln)}.ch .hit{fill:transparent}
.cr{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--ln)}.cr:first-of-type{border-top:0}.cr .lbl{margin-top:1px}.cr.dx{display:block;background:var(--bg);border-radius:10px;padding:10px;margin:4px 0}.cr.dx select{width:100%;margin:6px 0}
.cc button.ed{background:transparent;color:var(--ac);border-style:dashed}
.bg{display:grid;grid-template-columns:1fr 110px;gap:6px 10px;align-items:center;font-size:14px}.bg input{width:100%;text-align:right}
</style></head><body><main>

<div class="card hero"><div><h1>💸 Money Tracker</h1><div class="lbl">Wallets, savings, bills and tuition in one place</div></div>
<div class="row" style="flex-direction:column;align-items:flex-end;gap:6px"><button class="ic" id="th" title="Switch light/dark mode">🌙</button><span class="lbl" id="sy"></span></div></div>

<div class="tabs" role="tablist"><button data-tab="ov" class="on">🏠 Overview</button><button data-tab="lg">📒 Ledger</button><button data-tab="bl">🧾 Bills</button><button data-tab="pl">🎓 Tuition</button><button data-tab="db">💳 Debts</button><button data-tab="mo">⚙ More</button></div>
<div class="pn" id="p-ov"></div><div class="pn" id="p-lg" hidden></div><div class="pn" id="p-bl" hidden></div><div class="pn" id="p-pl" hidden></div><div class="pn" id="p-db" hidden></div><div class="pn" id="p-mo" hidden></div>
</main>
<button class="fab" id="fab" title="Add a transaction" aria-label="Add a transaction">＋</button>
<div class="tq" id="tq"></div>
<div class="ov" id="M"><div class="modal" id="MB"></div></div>
<input type="file" id="imp" accept=".json,application/json" hidden>

<script>
/* ---------- data ---------- */
const BILLS0=()=>[{id:"rent",n:"Rent",a:4500,c:"Rent"},{id:"wifi",n:"Wifi",a:799,c:"Internet"},{id:"elec",n:"Electricity",a:0,c:"Utilities",var:true},{id:"water",n:"Water",a:0,c:"Utilities",var:true}];
const DEF=()=>({v:1,acc:[{id:"wal",n:"Wallet",t:"cash",o:0},{id:"gc",n:"GCash",t:"ewallet",o:0},{id:"gt",n:"GoTyme",t:"savings",o:0},{id:"mb",n:"MariBank",t:"savings",o:0},{id:"hd",n:"Cash Savings",t:"savings",o:0}],
 cat:["Food & drinks","Groceries","Transport","Rent","Tuition","School","Internet","Load","Utilities","Subscriptions","Shopping","Personal care","Fun","Vices","Fees","Unrecorded","Other"],
 ic:["Allowance","Gift","Interest","Other income"],tx:[],bills:BILLS0(),paid:{},amt:{},bud:{},plans:[],la:"wal",theme:null,u:0});
const LS="money-v1",SK="money-sync";
let S=DEF();try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||"{}"))}catch(e){}
["acc","cat","ic","tx","bills","plans"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=DEF()[k]});["paid","bud","amt"].forEach(k=>{if(!S[k]||typeof S[k]!=="object")S[k]=DEF()[k]});S.bills.forEach(b=>{if(b.el){b.var=true;delete b.el}});
S.acc=S.acc.filter(a=>!(a.id==="gs"&&!(a.o)&&!S.tx.some(t=>t.a==="gs"||t.b==="gs")));
const $=i=>document.getElementById(i),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>{const n=parseFloat(String(s==null?"":s).replace(/,/g,""));return isNaN(n)?null:n};
const r2=n=>Math.round(n*100)/100;
const fmt=n=>{n=r2(n);const a=Math.abs(n);return(n<0?"−":"")+"₱"+a.toLocaleString("en-PH",{minimumFractionDigits:Number.isInteger(a)?0:2,maximumFractionDigits:2})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const ym=d=>d.slice(0,7);let CM=ym(todayStr());
const shiftM=(m,k)=>{const d=new Date(+m.slice(0,4),+m.slice(5)-1+k,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const mname=m=>new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleString("en-US",{month:"long",year:"numeric"});
const mshort=m=>new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleString("en-US",{month:"short",year:"2-digit"});
const dlabel=d=>new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8)).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const live=()=>S.tx.filter(t=>!t.x);
const accOf=id=>S.acc.find(a=>a.id===id),aname=id=>accOf(id)?accOf(id).n:"(deleted account)",isSav=id=>!!accOf(id)&&accOf(id).t==="savings";
const eff=t=>t.t==="exp"?[[t.a,-t.amt]]:t.t==="inc"||t.t==="adj"?[[t.a,t.amt]]:t.t==="debt"?[[t.a,t.dr*t.amt]]:t.t==="trf"?[[t.a,-(t.amt+(t.fee||0))],[t.b,t.amt]]:[];
function balances(){const b={};S.acc.forEach(a=>b[a.id]=a.o||0);live().forEach(t=>eff(t).forEach(([k,v])=>{if(k in b)b[k]+=v}));Object.keys(b).forEach(k=>b[k]=r2(b[k]));return b}
function mstats(m){const o={inc:0,exp:0,sav:0,adj:0,cats:{},n:0};live().filter(t=>ym(t.d)===m).forEach(t=>{o.n++;
 if(t.t==="inc")o.inc+=t.amt;else if(t.t==="exp"){o.exp+=t.amt;o.cats[t.c||"Other"]=(o.cats[t.c||"Other"]||0)+t.amt}
 else if(t.t==="trf"){if(t.fee){o.exp+=t.fee;o.cats.Fees=(o.cats.Fees||0)+t.fee}if(isSav(t.b)&&!isSav(t.a))o.sav+=t.amt;else if(isSav(t.a)&&!isSav(t.b))o.sav-=t.amt}
 else if(t.t==="adj")o.adj+=t.amt});return o}
/* ---------- save / sync ---------- */
let pt,SY={};try{SY=JSON.parse(localStorage.getItem(SK)||"{}")}catch(e){}
const sync=t=>{const e=$("sy");if(e)e.textContent=t};
const payload=()=>{const d=JSON.parse(JSON.stringify(S));delete d.theme;return d};
const keep=()=>{try{localStorage.setItem(LS,JSON.stringify(S));return true}catch(e){toast("⚠ This device’s storage is full. Export a backup now (More tab).");return false}};
const snap=label=>{try{localStorage.setItem("money-prev",JSON.stringify({at:Date.now(),label,data:payload()}));return true}catch(e){return false}};
const getPrev=()=>{try{return JSON.parse(localStorage.getItem("money-prev")||"null")}catch(e){return null}};
try{if(!localStorage.getItem("money-first"))localStorage.setItem("money-first",String(Date.now()));if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
const save=()=>{S.u=Date.now();keep();push()};
const GH=(p,o)=>fetch("https://api.github.com"+p,Object.assign({},o,{headers:{Authorization:"Bearer "+SY.t,Accept:"application/vnd.github+json","Content-Type":"application/json"}})).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
function push(){if(!SY.id)return;clearTimeout(pt);sync("Syncing…");pt=setTimeout(()=>GH("/gists/"+SY.id,{method:"PATCH",body:JSON.stringify({files:{"money.json":{content:JSON.stringify(payload())}}})}).then(()=>sync("☁ Synced")).catch(()=>sync(navigator.onLine?"Sync error: saved on this device":"Offline: saved on this device, will sync later")),600)}
function merge(a,b){const base=(b.u||0)>(a.u||0)?b:a,r=Object.assign({},base),m=new Map();[...(a.tx||[]),...(b.tx||[])].forEach(t=>{const o=m.get(t.id);if(!o||(t.m||0)>(o.m||0))m.set(t.id,t)});r.tx=[...m.values()];r.u=Math.max(a.u||0,b.u||0);return r}
async function cloud(){
 if(!SY.t){sync("Saved on this device only");return}
 try{
  if(!SY.id){let g=null;for(let p=1;p<=10&&!g;p++){const l=await GH("/gists?per_page=100&page="+p);if(!l.length)break;g=l.find(x=>x.description==="money-tracker-data")}
   SY.id=g?g.id:(await GH("/gists",{method:"POST",body:JSON.stringify({description:"money-tracker-data",public:false,files:{"money.json":{content:JSON.stringify(payload())}}})})).id;
   localStorage.setItem(SK,JSON.stringify(SY))}
  const g=await GH("/gists/"+SY.id),f=g.files&&g.files["money.json"];let d=null;if(f){const txt=f.truncated&&f.raw_url?await fetch(f.raw_url).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}):f.content;d=JSON.parse(txt)}
  if(d){const th=S.theme,m=merge(S,d);S=Object.assign(DEF(),m,{theme:th});migrate();keep();render();
   if(JSON.stringify(payload())!==JSON.stringify(d))push();else sync("☁ Synced")}else push()
 }catch(e){sync(navigator.onLine?"Sync error: check your token":"Offline: saved on this device")}}
function setupSync(){const t=prompt("Paste your GitHub token (classic token with only the “gist” permission). Leave empty to turn cloud sync off.",SY.t||"");
 if(t===null)return;SY=t.trim()?{t:t.trim()}:{};localStorage.setItem(SK,JSON.stringify(SY));cloud()}
function exportData(){const b=new Blob([JSON.stringify(payload(),null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="money-backup-"+todayStr()+".json";a.click();try{localStorage.setItem("money-lastbk",String(Date.now()))}catch(e){}toast("Backup downloaded ✓");if(TB==="ov"||TB==="mo")render()}
function replaceAll(d){const now=Date.now(),th=S.theme,ids=new Set((d.tx||[]).map(t=>t.id));
 const gone=S.tx.filter(t=>!ids.has(t.id)).map(t=>Object.assign({},t,{x:1,m:now}));
 S=Object.assign(DEF(),d,{theme:th});S.tx=(d.tx||[]).map(t=>Object.assign({},t,{m:now})).concat(gone);migrate();save();render()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.tx)||!Array.isArray(d.acc))throw 0;
 if(!confirm("Replace everything in the tracker with this file ("+d.tx.filter(t=>!t.x).length+" transactions)?\n\nYour current data is kept as an undo point (More → Your log)."))return;if(!snap("Before import")&&!confirm("Couldn’t save an undo point (storage is full). Continue anyway? Export a backup first if unsure."))return;replaceAll(d);toast("Imported ✓")}catch(e){alert("That file isn’t a valid backup.")}};r.readAsText(f)}
$("imp").onchange=e=>{importData(e.target.files[0]);e.target.value=""};
/* ---------- helpers: modal, toast, theme ---------- */
let tt;function toast(m){$("tq").textContent=m;$("tq").classList.add("on");clearTimeout(tt);tt=setTimeout(()=>$("tq").classList.remove("on"),2200)}
const openM=h=>{$("MB").innerHTML=h;$("M").classList.add("on")},closeM=()=>$("M").classList.remove("on");
$("M").onclick=e=>{if(e.target.id==="M")closeM()};
function ask(o){
 const f=(o.fields||[]).map(x=>{let i;
  if(x.t==="select")i=`<select id="q_${x.k}">${x.opts.map(p=>{const[v,l]=Array.isArray(p)?p:[p,p];return`<option value="${esc(v)}"${String(v)===String(x.v)?" selected":""}>${esc(l)}</option>`}).join("")}</select>`;
  else if(x.t==="check")i=`<input type="checkbox" id="q_${x.k}"${x.v?" checked":""}>`;
  else i=`<input id="q_${x.k}" type="${x.t==="num"?"text":x.t||"text"}"${x.t==="num"?' inputmode="decimal"':""} value="${esc(x.v==null?"":x.v)}" placeholder="${esc(x.ph||"")}">`;
  return x.t==="check"?`<label class="ck">${i} ${x.l}</label>`:`<label class="fl">${x.l}${i}</label>`}).join("");
 openM(`<h2>${o.title}</h2>${o.note?`<div class="lbl">${o.note}</div>`:""}${f}<div class="row sp" style="margin-top:14px">${o.del?'<button class="g dl" id="q_del">Delete</button>':"<span></span>"}<span class="row"><button class="g" id="q_cx">Cancel</button><button id="q_ok">${o.ok||"Save"}</button></span></div>`);
