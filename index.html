 cat:["Food & drinks","Groceries","Transport","Rent","Tuition","School","Internet","Load","Utilities","Subscriptions","Shopping","Personal care","Fun","Vices","Fees","Unrecorded","Other"],
 ic:["Allowance","Gift","Interest","Other income"],tx:[],bills:BILLS0(),paid:{},amt:{},bud:{},plans:[],la:"wal",theme:null,u:0,dh:[],wb:{a:2000,s:250,st:1,ex:["Rent","Tuition","Utilities","Internet"],items:[{c:"Transport",a:350},{c:"Food & drinks",a:1000}]},ef:{g:15000},bv:0,gs:0,mm:0,fresh:0});

 if(t.t==="inc")o.inc+=t.amt;else if(t.t==="exp"){o.exp+=t.amt;o.cats[t.c||"No category"]=(o.cats[t.c||"No category"]||0)+t.amt}

 else if(t.t==="adj")o.adj+=t.amt});return o}
